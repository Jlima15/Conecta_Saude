<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - ConectaSaúde</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <header class="cabecalho-site">

        <a href="inicio.html" class="link-logo">
            <img src="imagens/Logo_Miniatura.png" alt="Logo ConectaSaúde" class="logo-site">
        </a>

        <nav class="navegacao-site">
            <a href="Feed.html">Feed</a>
            <a href="Busca.html">Buscar</a>
            <a href="Postar.html">Postar</a>
            <a href="Perfil.html" class="link-ativo">Perfil</a>
            <a href="Solicitacoes.html">Solicitações</a>
        </nav>

    </header>

    <main class="conteudo-perfil">

        <section class="cartao-perfil">

            <img src="imagens/Perfil.png" alt="Foto de perfil" class="foto-perfil">

            <h1 id="nome-perfil">Carregando...</h1>

            <p class="nome-usuario" id="nome-usuario-perfil">
                @usuario
            </p>

            <div id="area-relacionamento" hidden></div>

            <p id="contagem-relacionamento"></p>

            <p class="descricao-perfil" id="descricao-perfil">
                Nenhuma biografia cadastrada.
            </p>

            <a href="Editar_perfil.html" id="botao-editar-perfil" class="botao botao-editar">
                Editar perfil
            </a>

        </section>

        <section class="cartao-informacoes">

            <h2>Informações</h2>

            <div class="lista-informacoes">

                <p>
                    <strong>Atividades:</strong>
                    <span id="atividades-perfil">Carregando...</span>
                </p>

                <p>
                    <strong>Nível:</strong>
                    <span id="nivel-perfil">Carregando...</span>
                </p>

                <p>
                    <strong>Privacidade:</strong>
                    <span id="privacidade-perfil">Carregando...</span>
                </p>

            </div>

        </section>

        <section class="secao-eventos">

            <h2>Meus eventos</h2>

            <div class="lista-eventos" id="lista-meus-eventos">
                <p>Carregando seus eventos...</p>
            </div>

        </section>


        <div class="area-sair">
            <a href="Login.html" class="botao-sair">
                Sair da conta
            </a>
        </div>

    </main>

    <script src="JS/logout.js"></script>
    <script src="JS/perfil.js"></script>
    <script src="JS/proteger_pagina.js"></script>
</body>

</html>
