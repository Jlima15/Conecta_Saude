<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca</title>
</head>
<body>

    <header>
    <img src="imagens/Logo_Miniatura.png" alt="Logo ConectaSaude">

    <nav>
        <a href="feed.html">Feed</a>
        <a href="Busca.html">Buscar</a>
        <a href="postar.html">Postar</a>
        <a href="Perfil.html">Perfil</a>
    </nav>
    </header>

    <input type="text" placeholder="Digite o que deseja buscar">
    <button>Buscar</button> <br>

    <button>Filtros</button>

    <form>
    <h2>Filtros</h2>

    <label>Idade:</label>
    <input type="number"><br>

    <label>Local:</label>
    <input type="text"><br>

    <label>Distância:</label>
    <select>
        <option>Até 500m</option>
        <option>500m - 1km</option>
        <option>1km - 3km</option>
        <option>3km - 5km</option>
        <option>Mais de 5km</option>
    </select><br>

    <label>Data:</label>
    <input type="date"><br>

    <label>Nível:</label>
    <select>
        <option>Iniciante</option>
        <option>Intermediário</option>
        <option>Avançado</option>
    </select><br>

    <button>Aplicar filtros</button>
    <button>Fechar</button>
    </form>
</body>
</html>
