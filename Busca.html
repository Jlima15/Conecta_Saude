
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar atividades - ConectaSaude</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="cabecalho-site">
        <a href="Apresentacao.html" class="link-logo">
            <img src="imagens/Logo_Miniatura.png"
                 alt="Logo ConectaSaude"
                 class="logo-site">
        </a>

        <nav class="navegacao-site">
            <a href="feed.html">Feed</a>
            <a href="Busca.html" class="link-ativo">Buscar</a>
            <a href="postar.html">Postar</a>
            <a href="Perfil.html">Perfil</a>
        </nav>
    </header>

    <main class="conteudo-busca">

        <section class="cabecalho-busca">
            <h1>Encontre sua próxima atividade</h1>
            <p>
                Descubra grupos e atividades físicas perto de você.
            </p>
        </section>

        <section class="cartao-busca">

            <form class="formulario-busca">
                <label for="pesquisa">O que você procura?</label>

                <div class="barra-pesquisa">
                    <input type="text" id="pesquisa" name="pesquisa"
                           placeholder="Ex: corrida, caminhada, ciclismo">

                    <button type="submit" class="botao botao-buscar">
                        Buscar
                    </button>
                </div>
            </form>

            <section class="secao-filtros">
                <h2>Filtros de busca</h2>

                <form class="formulario-filtros">

                    <div class="campo-formulario">
                        <label for="idade">Idade:</label>
                        <input type="number" id="idade" name="idade"
                               min="1" max="120" placeholder="Sua idade">
                    </div>

                    <div class="campo-formulario">
                        <label for="local-busca">Local:</label>
                        <input type="text" id="local-busca" name="local"
                               placeholder="Ex: Parque da Cidade">
                    </div>

                    <div class="campo-formulario">
                        <label for="distancia">Distância:</label>
                        <select id="distancia" name="distancia">
                            <option value="">Qualquer distância</option>
                            <option value="500m">Até 500 m</option>
                            <option value="1km">500 m - 1 km</option>
                            <option value="3km">1 km - 3 km</option>
                            <option value="5km">3 km - 5 km</option>
                            <option value="mais5km">Mais de 5 km</option>
                        </select>
                    </div>

                    <div class="campo-formulario">
                        <label for="data-busca">Data:</label>
                        <input type="date" id="data-busca" name="data">
                    </div>

                    <div class="campo-formulario">
                        <label for="nivel-busca">Nível:</label>
                        <select id="nivel-busca" name="nivel">
                            <option value="">Todos os níveis</option>
                            <option value="iniciante">Iniciante</option>
                            <option value="intermediario">Intermediário</option>
                            <option value="avancado">Avançado</option>
                        </select>
                    </div>

                    <div class="acoes-filtros">
                        <button type="submit" class="botao botao-aplicar-filtros">
                            Aplicar filtros
                        </button>

                        <button type="reset" class="botao botao-limpar-filtros">
                            Limpar filtros
                        </button>
                    </div>

                </form>
            </section>
        </section>

        <section class="resultados-busca">
            <h2>Atividades encontradas</h2>
            <p>
                As atividades disponíveis aparecerão aqui quando a busca
                estiver conectada aos dados do sistema.
            </p>
        </section>

    </main>

</body>
</html>
