<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer Postagem</title>
</head>
<body>
    <header>
    <img src="imagens/Logo_Miniatura.png" alt="Logo ConectaSaude">

    <nav>
        <a href="feed.html">Feed</a>
        <a href="Busca.html">Buscar</a>
        <a href="postar.html">Postar</a>
        <a href="Perfil.html">Perfil</a>
    </nav>
    </header>

    

    <h1>Criar atividade</h1>

    <form>

        <label for="titulo">Título da atividade:</label>
        <input type="text" id="titulo" placeholder="Ex: Corrida no Parque"><br>


        <label for="descricao">Descrição:</label>
        <textarea id="descricao" placeholder="Conte um pouco sobre a atividade"></textarea><br>


        <label for="atividade">Tipo de atividade:</label>

        <select id="atividade">
            <option>Corrida</option>
            <option>Caminhada</option>
            <option>Ciclismo</option>
            <option>Academia</option>
            <option>Futebol</option>
            <option>Outro</option>
        </select><br>


        <label for="local">Local:</label>
        <input type="text" id="local" placeholder="Ex: Parque da Cidade"><br>


        <label for="data">Data:</label>
        <input type="date" id="data"><br>


        <label for="horario">Horário:</label>
        <input type="time" id="horario"><br>


        <p>Nível da atividade:</p>

        <input type="radio" id="iniciante" name="nivel">
        <label for="iniciante">Iniciante</label>

        <input type="radio" id="intermediario" name="nivel">
        <label for="intermediario">Intermediário</label>

        <input type="radio" id="avancado" name="nivel">
        <label for="avancado">Avançado</label><br>

        <button type="submit">Publicar atividade</button>

    </form>




</body>
</html>
