
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar atividade - ConectaSaude</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="cabecalho-site">
        <a href="Apresentacao.html" class="link-logo">
            <img src="imagens/Logo_Miniatura.png"
                 alt="Logo ConectaSaude"
                 class="logo-site">
        </a>

        <nav class="navegacao-site">
            <a href="feed.html">Feed</a>
            <a href="Busca.html">Buscar</a>
            <a href="postar.html" class="link-ativo">Postar</a>
            <a href="Perfil.html">Perfil</a>
        </nav>
    </header>

    <main class="conteudo-postagem">

        <section class="cartao-postagem">

            <h1>Criar atividade</h1>
            <p class="descricao-postagem">
                Compartilhe uma atividade e convide outras pessoas para participar!
            </p>

            <form class="formulario-postagem">

                <div class="campo-formulario">
                    <label for="titulo">Título da atividade:</label>
                    <input type="text" id="titulo" name="titulo"
                           placeholder="Ex: Corrida no Parque" required>
                </div>

                <div class="campo-formulario">
                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" name="descricao"
                              placeholder="Conte um pouco sobre a atividade"
                              rows="4" required></textarea>
                </div>

                <div class="campo-formulario">
                    <label for="atividade">Tipo de atividade:</label>
                    <select id="atividade" name="atividade" required>
                        <option value="">Selecione uma atividade</option>
                        <option value="corrida">Corrida</option>
                        <option value="caminhada">Caminhada</option>
                        <option value="ciclismo">Ciclismo</option>
                        <option value="academia">Academia</option>
                        <option value="futebol">Futebol</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="local">Local:</label>
                    <input type="text" id="local" name="local"
                           placeholder="Ex: Parque da Cidade" required>
                </div>

                <div class="campos-data-horario">
                    <div class="campo-formulario">
                        <label for="data">Data:</label>
                        <input type="date" id="data" name="data" required>
                    </div>

                    <div class="campo-formulario">
                        <label for="horario">Horário:</label>
                        <input type="time" id="horario" name="horario" required>
                    </div>
                </div>

                <div class="campo-formulario">
                    <label for="nivel">Nível da atividade:</label>
                    <select id="nivel" name="nivel" required>
                        <option value="">Selecione o nível</option>
                        <option value="iniciante">Iniciante</option>
                        <option value="intermediario">Intermediário</option>
                        <option value="avancado">Avançado</option>
                    </select>
                </div>

                <button type="submit" class="botao botao-publicar">
                    Publicar atividade
                </button>

            </form>
        </section>
    </main>

</body>
</html>
