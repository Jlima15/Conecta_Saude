<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
</head>
<body>

    <header>
    <img src="imagens/Logo_Miniatura.png" alt="Logo ConectaSaude">

    <nav>
        <a href="feed.html">Feed</a>
        <a href="Busca.html">Buscar</a>
        <a href="postar.html">Postar</a>
        <a href="Perfil.html">Perfil</a>
    </nav>
    </header>

    <h1>Editar perfil</h1>

    <form>

        <section>

            <h2>Foto de perfil</h2>

            <img src="imagens/perfil.png" alt="Foto de perfil">

            <br>

            <label for="foto">Alterar foto:</label>
            <input type="file" id="foto" accept="image/png, image/jpeg">

        </section>


        <section>

            <h2>Informações pessoais</h2>

            <label for="nome">Nome:</label>
            <input type="text" id="nome">


            <label for="usuario">Nome de usuário:</label>
            <input type="text" id="usuario" placeholder="@nomeusuario">


            <label for="bio">Biografia:</label>
            <textarea id="bio" placeholder="Fale um pouco sobre você"></textarea>

        </section>


        <section>

            <h2>Atividades de interesse</h2>

            <input type="checkbox" id="corrida">
            <label for="corrida">Corrida</label>

            <input type="checkbox" id="caminhada">
            <label for="caminhada">Caminhada</label>

            <input type="checkbox" id="ciclismo">
            <label for="ciclismo">Ciclismo</label>

            <input type="checkbox" id="academia">
            <label for="academia">Academia</label>

            <input type="checkbox" id="futebol">
            <label for="futebol">Futebol</label>

        </section>


        <section>

            <h2>Nível de atividade</h2>

            <input type="radio" id="iniciante" name="nivel">
            <label for="iniciante">Iniciante</label>

            <input type="radio" id="intermediario" name="nivel">
            <label for="intermediario">Intermediário</label>

            <input type="radio" id="avancado" name="nivel">
            <label for="avancado">Avançado</label>

        </section>


        <section>

            <h2>Privacidade</h2>

            <input type="radio" id="publico" name="privacidade">
            <label for="publico">Perfil público</label>

            <input type="radio" id="privado" name="privacidade">
            <label for="privado">Perfil privado</label>

        </section>


        <button type="submit">Salvar alterações</button>

    </form>


</body>
</html>
